<!doctype html>
<html lang="en">
<!-- To test locally:
  python -m http.server 8000
  http://localhost:8000/
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Map Explorer</title>
  <!-- Increment this asset version in index.html and src imports together. -->
  <link rel="stylesheet" href="./style.css?v=20261112-5" />
</head>
<body>
  <header>
    <div class="row">
      <label>
        Explorer:
        <select id="appMode">
          <option value="cells" selected>symbolic cells</option>
          <option value="rationals">rational points</option>
        </select>
      </label>

      <label class="iters" data-cell-control>
        Cell depth: <span id="iterLabel" class="readout">10</span>
        <input id="iter" type="range" min="0" max="100" value="10" step="1" />
      </label>
      <label class="denominator" id="denominatorControl" hidden>
        Denominator <var>q</var>:
        <input id="denominatorRange" type="range" min="3" max="200" value="21" step="1" />
        <input id="denominatorNumber" type="number" min="3" max="2147483647" value="21" step="1" />
      </label>
      <div class="lineBreak" aria-hidden="true"></div>

      <label data-cell-control>
        Color mode:
        <select id="colorMode">
          <option value="0">distance-to-edge</option>
          <option value="1">which-edge-attracted</option>
          <option value="2">symbolic-hash (small N)</option>
          <option value="3" selected>first-return color</option>
        </select>
      </label>

      <label id="returnLimitControl" hidden>
        Return search limit:
        <input id="returnLimit" type="number" min="1" max="16384" value="2000" step="100" />
      </label>

      <label id="wholeWordControl" hidden>
        <input id="wholeWordColor" type="checkbox" />
        Color by the whole <var>wu</var> word
      </label>

      <button id="resetView">Reset view</button>
      <button id="backSelection" disabled>Back</button>
      <button id="exportPng">Export PNG</button>

      <span id="rationalLegend" class="legend" hidden>
        <span><i class="swatch singular"></i>singular</span>
        <span><i class="swatch periodic"></i>periodic</span>
        <span><i class="swatch preperiodic"></i>pre-periodic</span>
        <span><i class="swatch periodicNonprimitive"></i>periodic (gcd &gt; 1)</span>
        <span><i class="swatch preperiodicNonprimitive"></i>pre-periodic (gcd &gt; 1)</span>
      </span>
    </div>

    <div class="row small">
      <span id="mode">mode: fixed-depth cells</span>
      <span id="hover">hover: —</span>
      <span id="resolutionWarning" class="warning" hidden></span>
    </div>
  </header>

  <main>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>

    <aside id="detailsPanel" hidden>
      <h2 id="detailsHeading">Selected cell</h2>
      <pre id="cellDetails"></pre>
    </aside>
  </main>

  <script>
    if (window.location.protocol === "file:") {
      const message = "Chrome blocks this app's ES modules and shader files over file://. Serve this directory over HTTP (for example with VS Code's integrated server).";
      const hover = document.getElementById("hover");
      hover.textContent = message;
      hover.title = message;
    }
  </script>
  <script type="module" src="./src/main.js?v=20261112-5"></script>
</body>
</html>
